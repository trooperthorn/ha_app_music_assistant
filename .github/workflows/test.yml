# Script tests, config validation and an image build; release.yml calls it so the same checks gate every release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts and config (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install test requirements
        run: pip install -r requirements-test.txt
      - name: Lint
        run: ruff check scripts tests music_assistant_lm/providers/library_enrichment music_assistant_lm/patches/library_enrichment.py
      - name: Unit tests
        run: pytest -q
      - name: Validate YAML and the release version
        run: |
          python -c "
          import yaml
          for f in ['music_assistant_lm/config.yaml', 'music_assistant_lm/translations/en.yaml', 'repository.yaml']:
              with open(f, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print(f, 'OK')
          "
          python scripts/build_release_artifacts.py --validate-only

  image-build:
    name: App image builds (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image
        run: |
          VERSION="$(python3 scripts/build_release_artifacts.py --validate-only)"
          docker build --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_ARCH=${{ matrix.arch }}" \
            --tag "local/music_assistant_lm:${{ github.sha }}" music_assistant_lm
          EXPECTED_PLATFORM="${{ matrix.arch }}"
          if [ "$EXPECTED_PLATFORM" = aarch64 ]; then EXPECTED_PLATFORM=arm64; fi
          test "$(docker image inspect --format '{{.Architecture}}' "local/music_assistant_lm:${{ github.sha }}")" = "$EXPECTED_PLATFORM"
      - name: Report what the image serves
        run: |
          docker run --rm --entrypoint /app/venv/bin/python "local/music_assistant_lm:${{ github.sha }}" \
            -c "import importlib.metadata as m, music_assistant_frontend as f; print('server', m.version('music-assistant')); print('frontend', m.version('music-assistant-frontend'), f.where())"
      - name: Check the server patches took
        run: |
          docker run --rm --entrypoint /app/venv/bin/python "local/music_assistant_lm:${{ github.sha }}"             -c "import inspect; from music_assistant.providers.hass_players.player import HomeAssistantPlayer as P; assert 'select_source' in P.__dict__, 'hass_source_select patch missing'; import music_assistant.controllers.player_queues.queue_loader as L, music_assistant.controllers.streams.audio as A; assert '_play_source_steer' in inspect.getsource(L) and 'preferred_provider' in inspect.getsource(A), 'play_source_steer patch missing'; import aiosendspin.audio.codecs as C, aiosendspin.server.roles.player.v1 as V, music_assistant.providers.sendspin.player as S; assert 'bit_rate' in inspect.getsource(C.OpusEncoder) and 'set_opus_bit_rate' in inspect.getsource(V) and 'CONF_SENDSPIN_OPUS_BITRATE' in inspect.getsource(S), 'sendspin_opus_bitrate patch missing'; import music_assistant.controllers.config.providers as CP; assert 'browse_path' not in inspect.getsource(CP), 'browse_path anchor patch is still present; it and the folder_browser plugin must not both ship'; import music_assistant.controllers.music.controller as MC; assert 'music/trash/move' not in inspect.getsource(MC) and 'music/trash/empty' not in inspect.getsource(MC), 'music_trash anchor patch is still present; it and the library_trash plugin must not both ship'; import music_assistant.providers.playlist_bridge as PB, json; manifest = json.loads((__import__('pathlib').Path(PB.__file__).parent / 'manifest.json').read_text()); assert manifest['type'] == 'plugin' and manifest['domain'] == 'playlist_bridge' and manifest['builtin'] is True, 'playlist_bridge manifest missing, wrong, or not builtin (a non-builtin plugin never auto-loads)'; assert callable(getattr(PB, 'setup', None)) and hasattr(PB.PlaylistBridgeProvider, 'migrate_playlist') and hasattr(PB.PlaylistBridgeProvider, 'archive_playlists'), 'playlist_bridge is importable but would not load: missing module-level setup(), migrate_playlist, or archive_playlists on the provider class'; import music_assistant.providers.folder_browser as FB; fb_manifest = json.loads((__import__('pathlib').Path(FB.__file__).parent / 'manifest.json').read_text()); assert fb_manifest['type'] == 'plugin' and fb_manifest['domain'] == 'folder_browser' and fb_manifest['builtin'] is True and fb_manifest['allow_disable'] is False, 'folder_browser manifest missing, wrong, not builtin, or disableable'; assert callable(getattr(FB, 'setup', None)) and hasattr(FB.FolderBrowserProvider, 'browse_path'), 'folder_browser is importable but would not load: missing module-level setup() or browse_path on the provider class'; import music_assistant.providers.library_trash as LT; lt_manifest = json.loads((__import__('pathlib').Path(LT.__file__).parent / 'manifest.json').read_text()); assert lt_manifest['type'] == 'plugin' and lt_manifest['domain'] == 'library_trash' and lt_manifest['builtin'] is True and lt_manifest['allow_disable'] is False, 'library_trash manifest missing, wrong, not builtin, or disableable'; assert callable(getattr(LT, 'setup', None)) and all(hasattr(LT.LibraryTrashProvider, name) for name in ('trash_move', 'trash_list', 'trash_restore', 'trash_empty')), 'library_trash is importable but would not load: missing module-level setup() or one of the trash methods on the provider class'; import os, stat; assert os.path.isfile('/usr/local/bin/mass_with_drive.py') and os.stat('/usr/local/bin/mass_with_drive.py').st_mode & stat.S_IXUSR, 'drive wrapper missing'; import shutil; assert shutil.which('fsck.exfat') and shutil.which('rsync'), 'exfatprogs or rsync missing'; print('patches: hass_source_select, play_source_steer, sendspin_opus_bitrate, playlist_bridge, folder_browser, library_trash present; drive wrapper present')"
      - name: Check archive plugin imports against the pinned server
        run: |
          docker run --rm --entrypoint /app/venv/bin/python "local/music_assistant_lm:${{ github.sha }}" \
            -c "from music_assistant.providers.library_enrichment import LibraryEnrichmentProvider, SUPPORTED_SERVER; from music_assistant.providers.library_enrichment.store import ArchiveStore; from importlib.metadata import version; assert version('music-assistant') == SUPPORTED_SERVER; assert callable(LibraryEnrichmentProvider.capture)"
      - name: Check the wrapper hands over without a drive
        run: |
          docker run --rm "local/music_assistant_lm:${{ github.sha }}" --help 2>&1 | head -5 | grep -qi "usage\|music" && echo "wrapper runs the server entrypoint"
