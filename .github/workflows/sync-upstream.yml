# Follows the upstream server release, the fork frontend release and the
# upstream app definition; opens an auto-merging PR when any of them moved.
# See docs/operations.md.
name: Sync upstream

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  # The frontend fork asks for a sync as soon as it publishes a wheel, so a
  # release does not sit until the next scheduled run. It sends this rather
  # than a workflow_dispatch because dispatching a workflow needs an Actions
  # write permission, and the release App holds only Contents and Pull
  # requests -- repository_dispatch is reachable with the Contents write it
  # already has. See docs/operations.md.
  repository_dispatch:
    types:
      - fork-frontend-published

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Apply the upstream pins
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -r requirements-test.txt
          python scripts/sync_upstream.py

      # A server bump changes the bytes the anchored patches will edit. The
      # fixture/version check fails until those anchors are reviewed.
      - name: Verify pinned server patch compatibility
        if: steps.sync.outputs.changed == 'true'
        run: pytest -q tests/test_patches.py

      - name: Verify release-automation credentials are configured
        if: steps.sync.outputs.changed == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure RELEASE_AUTOMATION_CLIENT_ID and RELEASE_AUTOMATION_PRIVATE_KEY; see docs/operations.md."
            exit 1
          fi

      - name: Create short-lived release-automation token
        if: steps.sync.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve the GitHub App commit identity
        if: steps.sync.outputs.changed == 'true'
        id: app-identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          printf 'name=%s[bot]\n' "$APP_SLUG" >> "$GITHUB_OUTPUT"
          printf 'email=%s+%s[bot]@users.noreply.github.com\n' \
            "$APP_USER_ID" "$APP_SLUG" >> "$GITHUB_OUTPUT"

      - name: Push the sync branch
        if: steps.sync.outputs.changed == 'true'
        env:
          BRANCH: automation/upstream-sync
          BOT_EMAIL: ${{ steps.app-identity.outputs.email }}
          BOT_NAME: ${{ steps.app-identity.outputs.name }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          git switch --force-create "$BRANCH"
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -- music_assistant_lm
          git commit -m "Sync upstream pins" -m "$SUMMARY"
          if [ -z "$REMOTE_SHA" ]; then
            git push --set-upstream origin "HEAD:refs/heads/$BRANCH"
          else
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Create or refresh the sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          BRANCH: automation/upstream-sync
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Sync upstream pins"
          BODY="$(printf '%s\n\n%s\n\n%s' \
            "Automated refresh of the upstream server, fork frontend and app definition pins." \
            "$SUMMARY" \
            "The protected-branch checks must pass before this PR auto-merges; the release automation then publishes a new app version.")"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" --base main --title "$TITLE" --body "$BODY")"
            PR_NUMBER="${PR_URL##*/}"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
          # Auto-merge can only be enabled once GitHub has registered the
          # PR's required checks; right after gh pr create/edit that has not
          # always happened yet, and enablePullRequestAutoMerge fails with
          # "Pull request is in unstable status". Retry with a short sleep
          # instead of failing outright, so a green PR never silently sits
          # without auto-merge enabled -- but still fail loudly if every
          # attempt is exhausted, so a genuine problem is not hidden.
          ATTEMPTS=6
          DELAY=10
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if gh pr merge "$PR_NUMBER" --auto --squash --delete-branch --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "::warning::Enabling auto-merge on PR #$PR_NUMBER failed (attempt $attempt/$ATTEMPTS); checks may not have registered yet, retrying in ${DELAY}s."
            sleep "$DELAY"
          done
          echo "::error::Failed to enable auto-merge on PR #$PR_NUMBER after $ATTEMPTS attempts. The PR is open but will not auto-merge; enable it manually with 'gh pr merge $PR_NUMBER --auto --squash --delete-branch --repo $GITHUB_REPOSITORY' or investigate why it stays unstable."
          exit 1
