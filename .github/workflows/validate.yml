# App config and Dockerfile validation; apps are not distributed through HACS, so no hacs or hassfest job.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  app-config:
    name: App config well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate the app definition
        run: |
          pip install pyyaml
          python -c "
          import yaml
          cfg = yaml.safe_load(open('music_assistant_lm/config.yaml', encoding='utf-8'))
          for key in ('name', 'version', 'slug', 'description', 'arch'):
              assert key in cfg, key
          assert cfg['slug'] == 'music_assistant_lm'
          assert 'image' not in cfg, 'the image is built locally'
          yaml.safe_load(open('repository.yaml', encoding='utf-8'))
          print('config OK')
          "
      - name: Upstream drift report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pyyaml
          python scripts/sync_upstream.py --check

  hadolint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: music_assistant_lm/Dockerfile
          failure-threshold: error
