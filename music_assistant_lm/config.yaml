# Mirrors music-assistant/home-assistant-addon music_assistant/config.yaml;
# scripts/sync_upstream.py refreshes every key except name, version, slug,
# description and url, which are this app's own.
name: Music Assistant (Library Manager)
version: "2026.09.19.7"
slug: music_assistant_lm
description: Music Assistant server with the trooperthorn library-manager frontend (desktop source tree,
  browser strip, dense track grid, queue and selected-item panes). Tracks the upstream server release.
url: https://github.com/trooperthorn/ha_app_music_assistant
arch:
- amd64
- aarch64
homeassistant_api: true
discovery:
- music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
uart: false
apparmor: true
map:
- media:rw
- ssl:ro
- share:rw
init: false
backup_exclude:
- cache.db
- collage_images/*
- .cache/*
- webrtc_private_key.pem
stage: stable
tmpfs: true
options:
  log_level: info
  safe_mode: false
  music_drive_task: none
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
  music_drive: device(subsystem=block)?
  music_drive_task: list(none|backup|verify|restore|repair)
privileged:
- SYS_ADMIN
- DAC_READ_SEARCH
udev: true
kernel_modules: true
